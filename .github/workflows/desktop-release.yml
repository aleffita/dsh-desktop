name: Desktop release

# Cuts a distributable DSH Desktop build from this fork and serves it as our own
# update channel: the DMG and the electron-updater feed file are attached to a
# GitHub release, and the app built here carries `app-update.yml` pointing at
# `aleffita/dsh-desktop`. Nothing is published to npm.
#
#   stable  a release whose version has no pre-release suffix
#   rc      a release candidate, e.g. 2.0.10-rc.1, published as a pre-release
#
# The version is owned by the repository (`dsh-plugin-desktop/package.json`), so
# a release is a version bump commit followed by a tag; this workflow verifies
# that the tag and the committed version agree instead of rewriting either.

on:
  push:
    tags:
      - 'v*'
      - 'beta-v*'
      - 'dev-v*'
      - 'pr-*-v*'
  workflow_dispatch:
    inputs:
      channel:
        description: Channel slug for a manual cut
        type: choice
        options:
          - rc
          - stable
        default: rc

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  macos:
    name: macOS universal DMG
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
      - run: corepack enable

      - name: Resolve Yarn cache folder
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('yarn.lock', '.yarnrc.yml') }}
      - run: yarn install --immutable

      - name: Resolve release identity
        id: release
        shell: bash
        run: |
          set -euo pipefail
          # Lane tags carry their channel: v*, beta-v*, dev-v*, pr-<n>-v*. The slug is the
          # registry's, and every later step names the channel rather than a build directory.
          tag="${GITHUB_REF_NAME}"
          case "$tag" in
            beta-v*) slug=beta ;;
            dev-v*) slug=dev ;;
            pr-*-v*) slug=pr ;;
            v*) slug=main ;;
            *) echo "::error::tag $tag does not belong to a lane"; exit 1 ;;
          esac
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            slug="${{ inputs.channel || 'dev' }}"
            version=""
          else
            raw="$tag"
            raw="${raw#beta-v}"
            raw="${raw#dev-v}"
            if [[ "$raw" == pr-*-v* ]]; then raw="${raw##*-v}"; fi
            version="${raw#v}"
          fi
          entry="$(node -e "
            const yaml = require('yaml');
            const fs = require('fs');
            const registry = yaml.parse(fs.readFileSync('fita/channels.yml', 'utf8'));
            const channel = registry.channels.find(entry => entry.slug === process.argv[1]);
            if (!channel) { console.error('unknown channel'); process.exit(1); }
            process.stdout.write(JSON.stringify(channel));
          " "$slug")"
          if [[ -z "$entry" ]]; then
            echo "::error::$slug is not in fita/channels.yml"
            exit 1
          fi
          channel="$(node -e "process.stdout.write(JSON.parse(process.argv[1]).feed)" "$entry")"
          artifact_slug="$(node -e "process.stdout.write(JSON.parse(process.argv[1]).artifactSlug)" "$entry")"
          prerelease="$(node -e "process.stdout.write(String(JSON.parse(process.argv[1]).prerelease))" "$entry")"
          committed="$(node -p "require('./dsh-plugin-desktop/package.json').version")"
          if [[ -z "$version" ]]; then version="$committed"; fi
          if [[ "$version" != "$committed" ]]; then
            echo "::error::version $version (tag/input) does not match the committed Desktop version $committed"
            exit 1
          fi
          # The registry says which channels carry pre-releases; the tag cannot contradict it.
          if [[ "$prerelease" == "false" && "$version" == *-* ]]; then
            echo "::error::$slug is a stable channel and cannot carry a pre-release version ($version)"
            exit 1
          fi
          {
            echo "version=$version"
            echo "slug=$slug"
            echo "channel=$channel"
            echo "artifactSlug=$artifact_slug"
            echo "prerelease=$prerelease"
            echo "tag=v$version"
          } >> "$GITHUB_OUTPUT"

      - name: Package gate
        run: yarn workspace dsh-plugin-desktop check:mac-package

      - name: Package the channel
        env:
          DSH_PACKAGE_CHECK_ALREADY_RAN: '1'
        # One channel per tag, built through the fork's packaging wrapper so the app carries
        # the channel's own product name, bundle id, updater feed and artifact names — and so
        # both update layers are produced: the DMG for a full install and the zip an app
        # updates itself from.
        run: yarn fita:package --channel ${{ steps.release.outputs.slug }}

      - name: Collect release assets
        id: assets
        shell: bash
        run: |
          set -euo pipefail
          slug="${{ steps.release.outputs.slug }}"
          version="${{ steps.release.outputs.version }}"
          source="dsh-plugin-desktop/dist/mac-${slug}"
          destination="release-assets"
          mkdir -p "$destination"
          if [[ ! -f "$source/fita-channel.json" ]]; then
            echo "::error::$source carries no fita-channel.json; the channel was not packaged"
            exit 1
          fi
          # The manifest is what says what was built, so asset names come from it rather than
          # from a guess about how electron-builder spells them.
          node -e "
            const fs = require('fs');
            const path = require('path');
            const manifest = JSON.parse(fs.readFileSync(process.argv[1], 'utf8'));
            const source = process.argv[2];
            const destination = process.argv[3];
            const copies = [manifest.dmg, manifest.zip, manifest.feedFile].filter(Boolean);
            for (const name of copies) {
              fs.copyFileSync(path.join(source, name), path.join(destination, name));
              const blockmap = path.join(source, name + '.blockmap');
              if (fs.existsSync(blockmap)) fs.copyFileSync(blockmap, path.join(destination, name + '.blockmap'));
            }
            fs.copyFileSync(path.join(source, 'fita-channel.json'), path.join(destination, 'fita-channel.json'));
          " "$source/fita-channel.json" "$source" "$destination"
          (cd "$destination" && shasum -a 256 ./* > SHA256SUMS.txt)
          ls -l "$destination"
          echo "slug=${{ steps.release.outputs.artifactSlug }}-${version}" >> "$GITHUB_OUTPUT"
          echo "feed=${{ steps.release.outputs.channel }}-mac.yml" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.assets.outputs.slug }}
          path: release-assets/*
          if-no-files-found: error

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          SLUG: ${{ steps.release.outputs.slug }}
          VERSION: ${{ steps.release.outputs.version }}
          FEED: ${{ steps.assets.outputs.feed }}
          TAG: ${{ steps.release.outputs.tag }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          app_name="$(node -e "
            const yaml = require('yaml');
            const fs = require('fs');
            const registry = yaml.parse(fs.readFileSync('fita/channels.yml', 'utf8'));
            process.stdout.write(registry.application.appName);
          ")""
          title="${app_name} ${VERSION} — macOS universal"
          notes="$(mktemp)"
          {
            echo "Unsigned macOS universal build of the **${SLUG}** lane of **${app_name}**, cut from \`${SLUG}\`'s branch of \`aleffita/dsh-desktop\`."
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Channel | \`${SLUG}\` |"
            echo "| Version | \`${VERSION}\` |"
            echo "| Application | \`${app_name}\` |"
            echo "| Platform | macOS universal (arm64 + x64) |"
            echo "| Signing | unsigned, not notarized |"
            echo "| Update feed | ${FEED:-none} |"
            echo
            echo "### Install"
            echo
            echo '```sh'
            echo "yarn fita install ${SLUG}"
            echo '```'
            echo
            echo "Downloads both layers: the DMG for a full install and the zip the app updates itself from. Verify with the release's \`SHA256SUMS.txt\`, or run the app and let it update in place."
          } > "$notes"
          args=(--title "$title" --notes-file "$notes")
          if [[ "$PRERELEASE" == "true" ]]; then args+=(--prerelease); fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" "${args[@]}"
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" release-assets/* "${args[@]}"
          fi
